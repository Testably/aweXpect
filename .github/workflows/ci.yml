name: CI

on:
    workflow_dispatch:
    pull_request:
        branches: [ main ]

jobs:
    unit-tests:
        name: "Unit tests"
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.3xx
            -   name: Run unit tests (windows)
                if: matrix.os == 'windows-latest'
                run: ./build.ps1 UnitTestsWithCoverage TestFrameworks
            -   name: Run unit tests (ubuntu|macos)
                if: matrix.os != 'windows-latest'
                run: ./build.sh UnitTestsWithCoverage TestFrameworks
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: ${{ runner.os }}-artifacts
                    path: |
                        ./Artifacts/*
                        ./TestResults/*.trx
    
    aot-smoke-tests:
        name: "AOT smoke tests"
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.3xx
            -   name: Run AOT smoke tests (windows)
                if: matrix.os == 'windows-latest'
                run: ./build.ps1 AotSmokeTests
            -   name: Run AOT smoke tests (ubuntu|macos)
                if: matrix.os != 'windows-latest'
                run: ./build.sh AotSmokeTests
    
    mutation-tests-core:
        name: "Mutation tests (aweXpect.Core)"
        runs-on: ubuntu-latest
        timeout-minutes: 150
        env:
            DOTNET_NOLOGO: true
            # A mutant that allocates without bound otherwise exhausts the runner and takes the whole VM with it,
            # which surfaces as an unattributable "the runner has received a shutdown signal". It reaches only the
            # test host, through `RuntimeHostConfigurationOption` in the test projects, because the environment
            # variable that would do the same overrides it everywhere - including in the compiler, which needs far
            # more memory than the test host ever does.
            MutationTestHeapHardLimit: "0x20000000"
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: |
                        10.0.3xx
            -   name: Run mutation tests
                # The sampler writes into the live job log, because a runner that runs out of memory is torn down
                # before `if: always()` steps run, so anything it left in an artifact is lost. It has to be reaped
                # before the step ends, because a surviving background process holds the step's stdout open, and
                # it cannot be reaped from an `EXIT` trap, because the trap replaces the exit code of the build.
                run: |
                    while sleep 60; do
                        echo "resources: $(free -m | awk 'NR==2{print "mem_used="$3"M mem_available="$7"M"}') disk_available=$(df -m --output=avail / | tail -1)M"
                    done &
                    sampler=$!
                    status=0
                    ./build.sh MutationTestsCore || status=$?
                    pkill -P "$sampler" 2>/dev/null || true
                    kill "$sampler" 2>/dev/null || true
                    wait "$sampler" 2>/dev/null || true
                    exit "$status"
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: MutationTestsCore
                    path: |
                        ./Artifacts/*
    
    mutation-tests-main:
        name: "Mutation tests (aweXpect)"
        runs-on: ubuntu-latest
        timeout-minutes: 150
        env:
            DOTNET_NOLOGO: true
            # A mutant that allocates without bound otherwise exhausts the runner and takes the whole VM with it,
            # which surfaces as an unattributable "the runner has received a shutdown signal". It reaches only the
            # test host, through `RuntimeHostConfigurationOption` in the test projects, because the environment
            # variable that would do the same overrides it everywhere - including in the compiler, which needs far
            # more memory than the test host ever does.
            MutationTestHeapHardLimit: "0x20000000"
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: |
                        10.0.3xx
            -   name: Run mutation tests
                # The sampler writes into the live job log, because a runner that runs out of memory is torn down
                # before `if: always()` steps run, so anything it left in an artifact is lost. It has to be reaped
                # before the step ends, because a surviving background process holds the step's stdout open, and
                # it cannot be reaped from an `EXIT` trap, because the trap replaces the exit code of the build.
                run: |
                    while sleep 60; do
                        echo "resources: $(free -m | awk 'NR==2{print "mem_used="$3"M mem_available="$7"M"}') disk_available=$(df -m --output=avail / | tail -1)M"
                    done &
                    sampler=$!
                    status=0
                    ./build.sh MutationTestsMain || status=$?
                    pkill -P "$sampler" 2>/dev/null || true
                    kill "$sampler" 2>/dev/null || true
                    wait "$sampler" 2>/dev/null || true
                    exit "$status"
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: MutationTestsMain
                    path: |
                        ./Artifacts/*
    
    benchmarks:
        name: "Benchmarks"
        runs-on: ubuntu-latest
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.3xx
            -   name: Run benchmarks
                run: ./build.sh Benchmarks
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: Benchmarks
                    path: |
                        ./Artifacts/*
                    if-no-files-found: ignore
    
    static-code-analysis:
        name: "Static code analysis"
        if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        runs-on: ubuntu-latest
        env:
            REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.3xx
            -   name: Run sonarcloud analysis
                run: ./build.sh CodeAnalysis
    
    publish-test-results:
        name: "Publish Tests Results"
        needs: [ unit-tests, aot-smoke-tests ]
        runs-on: ubuntu-latest
        permissions:
            checks: write
            pull-requests: write
        if: always()
        steps:
            -   name: Download Artifacts
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    path: artifacts
            -   name: Publish Test Results
                uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
                with:
                    comment_mode: always
                    files: "artifacts/**/**/*.trx"
